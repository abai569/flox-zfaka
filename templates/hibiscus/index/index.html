<script>
(function(){
	var $ = layui.jquery;
	var layer = layui.layer;
	var activeTid = '0';

	$('#zf-category-list').on('click', '.zf-category-item', function(){
		var $item = $(this);
		var tid = $item.attr('data-tid');
		$('#zf-category-list .zf-category-item').removeClass('zf-category-active');
		$item.addClass('zf-category-active');
		activeTid = tid;
		filterProducts();
	});

	$('#zf-search-input').on('input', function(){
		filterProducts();
	});

	$('#zf-category-toggle').on('click', function(){
		$('#zf-category-panel').toggleClass('zf-category-open');
	});

	function filterProducts(){
		var keyword = $.trim($('#zf-search-input').val()).toLowerCase();
		var visible = 0;
		$('.zf-product-card').each(function(){
			var $card = $(this);
			var tid = $card.attr('data-typeid');
			var name = ($card.attr('data-name') || '').toLowerCase();
			var matchTid = (activeTid === '0' || tid === activeTid);
			var matchKw = (!keyword || name.indexOf(keyword) !== -1);
			if(matchTid && matchKw){
				$card.show();
				visible++;
			}else{
				$card.hide();
			}
		});
		if(visible === 0){
			if($('#zf-catalog-grid .zf-catalog-empty').length === 0){
				$('#zf-catalog-grid').append('<div class="zf-catalog-empty"><i class="layui-icon layui-icon-search"></i><p>未找到匹配商品</p></div>');
			}
			$('#zf-catalog-grid .zf-catalog-empty').show();
		}else{
			$('#zf-catalog-grid .zf-catalog-empty').hide();
		}
	}

	var layeradHtml = $("#layerad").html();
	if(typeof(layeradHtml) !== "undefined" && layeradHtml.length > 0){
		layer.open({
			type: 1,
			title: false,
			closeBtn: false,
			area: '300px;',
			shade: 0.8,
			id: 'zlkbAD',
			btn: ['关闭'],
			btnAlign: 'c',
			moveType: 1,
			content: '<div style="padding: 50px; line-height: 22px; background-color: #393D49; color: #fff; font-weight: 300;">'+layeradHtml+'</div>'
		});
	}
})();
</script>
