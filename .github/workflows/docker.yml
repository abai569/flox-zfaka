name: Build and publish Docker image

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read
  packages: write

env:
  IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/flox-zfaka

jobs:
  docker:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Validate shell scripts
        run: |
          bash -n install.sh
          sh -n docker/docker-entrypoint.sh

      - name: Validate Docker Compose
        run: docker compose --env-file .env.example config --quiet

      - name: Set up PHP 7.4
        uses: shivammathur/setup-php@v2
        with:
          php-version: "7.4"

      - name: Validate PHP syntax
        run: find . -type f -name '*.php' -not -path './vendor/*' -print0 | xargs -0 -n1 php -l

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build smoke-test image
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          push: false
          tags: flox-zfaka:smoke
          build-args: |
            APP_VERSION=${{ github.ref_name }}

      - name: Run container smoke test
        shell: bash
        run: |
          set -euo pipefail
          docker network create zfaka-ci
          docker run -d --name zfaka-ci-mysql --network zfaka-ci \
            -e MYSQL_ROOT_PASSWORD=ci_root_password \
            -e MYSQL_DATABASE=faka \
            -e MYSQL_USER=faka \
            -e MYSQL_PASSWORD=ci_database_password \
            mysql:8.0 \
            --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci

          for attempt in $(seq 1 60); do
            if docker exec zfaka-ci-mysql mysqladmin ping -uroot -pci_root_password --silent; then
              break
            fi
            if [ "$attempt" -eq 60 ]; then
              docker logs zfaka-ci-mysql
              exit 1
            fi
            sleep 2
          done

          docker run -d --name zfaka-ci-web --network zfaka-ci -p 18089:80 \
            -e DB_HOST=zfaka-ci-mysql \
            -e DB_NAME=faka \
            -e DB_USER=faka \
            -e DB_PASSWORD=ci_database_password \
            -e ADMIN_DIR=Admin \
            flox-zfaka:smoke

          for attempt in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:18089/ >/dev/null; then
              break
            fi
            if [ "$attempt" -eq 60 ]; then
              docker logs zfaka-ci-web
              exit 1
            fi
            sleep 3
          done

          docker exec zfaka-ci-web php -m | grep -qi '^yaf$'
          docker logs zfaka-ci-web 2>&1 | grep -q 'INIT_DONE'
          test "$(docker exec zfaka-ci-mysql mysql -N -B -ufaka -pci_database_password faka -e "SELECT COUNT(*) FROM t_config;")" -gt 0
          admin_login_page=$(curl -fsS http://127.0.0.1:18089/Admin/login)
          grep -q '<title>登录-管理系统</title>' <<<"$admin_login_page"
          grep -q '<form class="layui-form">' <<<"$admin_login_page"
          product_query_page=$(curl -fsS http://127.0.0.1:18089/product/query)
          grep -q '订单查询' <<<"$product_query_page"
          grep -q 'name="orderid"' <<<"$product_query_page"
          ! grep -q '商品分类' <<<"$product_query_page"

      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            APP_VERSION=${{ github.ref_name }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
