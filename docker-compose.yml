services:
  db:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${DB_NAME:-zfaka}
      MYSQL_USER: ${DB_USER:-zfaka}
      MYSQL_PASSWORD: ${DB_PASSWORD}
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u root -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 5s
      timeout: 5s
      retries: 30

  web:
    image: ${ZFAKA_IMAGE:-ghcr.io/abai569/flox-zfaka:1.5.1}
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_HOST: db
      DB_PORT: 3306
      DB_NAME: ${DB_NAME:-zfaka}
      DB_USER: ${DB_USER:-zfaka}
      DB_PASSWORD: ${DB_PASSWORD}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@example.com}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
      ADMIN_DIR: ${ADMIN_DIR:-Goadmin}
      ZFAKA_VERSION: ${ZFAKA_VERSION:-1.5.1}
    ports:
      - "${ZFAKA_PORT:-8089}:80"
    volumes:
      - logs_data:/var/www/html/log
      - temp_data:/var/www/html/temp
      - uploads_data:/var/www/html/public/res/upload
      - install_data:/var/www/html/install
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost/ >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 12

volumes:
  mysql_data:
  logs_data:
  temp_data:
  uploads_data:
  install_data:
